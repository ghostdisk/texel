<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' ws://127.0.0.1:5173" />
    <title>imged</title>
  </head>
  <body>
    <div id="error" role="alert" hidden></div>
    <div id="app" inert>
      <header class="topbar">
        <span class="wordmark">imged<span>.</span></span>
        <span class="separator"></span>
        <button data-action="file.new">New</button>
        <button data-action="file.open">Add image…</button>
        <span class="document-name">Untitled <span id="frame-label"></span></span>
        <button data-action="history.undo" title="Undo (Ctrl+Z)">↶</button>
        <button data-action="history.redo" title="Redo (Ctrl+Shift+Z)">↷</button>
      </header>
      <div class="workspace">
        <aside class="tools" aria-label="Tools">
          <button class="tool active" data-action="tool.brush" aria-label="Brush (B)" title="Brush (B)">✎</button>
          <button class="tool" data-action="tool.rectangle" aria-label="Rectangle (R)" title="Rectangle (R)">▭</button>
          <button class="tool" data-action="tool.transform" aria-label="Move and transform (V)" title="Move / transform (V)">↖</button>
          <button class="tool" data-action="tool.eyedropper" aria-label="Eyedropper (I)" title="Eyedropper (I) · Hold Alt with Brush">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m15 4 5 5M14 5l-9 9-1 5 5-1 9-9M15 4l2-2 5 5-2 2M5 14l4 4"/></svg>
          </button>
          <div class="tool-modes">
            <button class="tool mode-tool" data-action="drawing.erase" aria-label="Erase mode (E)" aria-pressed="false" title="Toggle draw / erase (E)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m14 3 7 7-10 10H7l-5-5L14 3ZM7 10l7 7M11 20h10"/></svg>
            </button>
            <button class="tool mode-tool" data-action="selection.mode" aria-label="Edit selection (S)" aria-pressed="false" title="Toggle selection editing (S)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" stroke-dasharray="3 2"/></svg>
            </button>
          </div>
          <div class="color-palette" role="group" aria-label="Drawing colors">
            <input id="secondary-color" class="secondary-color" type="color" value="#ffffff" aria-label="Secondary color" title="Secondary color" />
            <input id="brush-color" class="primary-color" type="color" value="#000000" aria-label="Primary color" title="Primary color" />
            <button class="color-swap" data-action="colors.swap" title="Swap colors (X)" aria-label="Swap primary and secondary colors (X)">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 4h9M8 1l3 3-3 3M12 10H3m3-3-3 3 3 3"/></svg>
            </button>
            <button class="color-defaults" data-action="colors.reset" title="Default colors (D)" aria-label="Default black and white colors (D)">
              <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="5" y="5" width="8" height="8" fill="white" stroke="#9298a8"/><rect x="1" y="1" width="8" height="8" fill="black" stroke="#9298a8"/></svg>
            </button>
          </div>
        </aside>
        <main class="workarea">
          <div id="stage" class="stage">
            <canvas id="canvas" aria-label="Image canvas"></canvas>
            <svg id="tool-overlay" aria-hidden="true"></svg>
            <div id="brush-cursor" hidden></div>
          </div>
          <footer class="statusbar">
            <button id="zoom-label" data-action="view.fit" title="Fit image">100%</button>
          </footer>
        </main>
        <aside class="sidebar">
          <section class="tool-options-section">
            <div class="section-heading"><h2 id="tool-name">Brush</h2></div>
            <div id="tool-options"></div>
          </section>
          <section class="layer-section">
            <div class="section-heading"><h2>Layers</h2><span id="layer-count"></span></div>
            <div class="layer-actions">
              <button data-action="layer.new" title="Add pixel layer">+ Layer</button>
              <button data-action="group.new" title="Add group">+ Group</button>
              <span class="spacer"></span>
              <button id="layer-up" data-action="layer.up" title="Move up" aria-label="Move layer up">↑</button>
              <button id="layer-down" data-action="layer.down" title="Move down" aria-label="Move layer down">↓</button>
              <button data-action="layer.delete" title="Delete layer" aria-label="Delete layer">×</button>
            </div>
            <div id="layer-tree" class="layer-tree" aria-label="Layer stack"></div>
          </section>
          <section class="properties">
            <div class="section-heading"><h2>Properties</h2><span id="layer-kind"></span></div>
            <p id="layer-size" class="muted"></p>
            <div id="selection-actions" class="selection-actions" hidden>
              <button data-action="selection.promote">Promote to mask</button>
              <button data-action="selection.deselect">Deselect</button>
            </div>
            <label class="field">Blend <select id="layer-blend"><option value="normal">Normal</option><option value="add">Add</option></select></label>
            <div id="layer-opacity-control"></div>
            <div id="transform-fields" hidden>
              <div class="field-pair">
                <label class="field">X <input id="layer-x" type="number" step="1" /></label>
                <label class="field">Y <input id="layer-y" type="number" step="1" /></label>
              </div>
              <div class="field-pair">
                <label class="field">Scale X % <input id="layer-scale-x" type="number" step="1" /></label>
                <label class="field">Scale Y % <input id="layer-scale-y" type="number" step="1" /></label>
              </div>
              <label class="field">Rotation ° <input id="layer-angle" type="number" step="1" /></label>
            </div>
          </section>
          <section class="effects-section">
            <div class="section-heading"><h2>Filters</h2><select id="add-filter" aria-label="Add filter"></select></div>
            <div id="filter-stack"></div>
          </section>
        </aside>
      </div>
    </div>
    <dialog id="size-dialog">
      <form id="size-form">
        <h2 id="dialog-title">New document</h2>
        <p id="dialog-description"></p>
        <div class="field-pair">
          <label class="field">Width <input id="new-width" type="number" min="1" value="1000" required /></label>
          <label class="field">Height <input id="new-height" type="number" min="1" value="750" required /></label>
        </div>
        <div class="dialog-actions"><button id="cancel-size" type="button">Cancel</button><button class="primary" id="confirm-size" type="submit">Create document</button></div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
