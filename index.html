<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' ws://127.0.0.1:*" />
    <title>Texel</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" type="image/svg+xml" href="/assets/branding/icon.svg" />
  </head>
  <body>
    <div id="error" role="alert" hidden></div>
    <div id="app" inert>
      <header class="titlebar">
        <div class="titlebar-content">
          <div class="wordmark"><img src="/assets/branding/icon.svg" width="28" height="28" alt="" />Texel</div>
          <nav class="app-menus" aria-label="Application menu">
            <button data-menu="File" data-mnemonic="f" aria-haspopup="menu" aria-expanded="false">File</button>
            <button data-menu="Edit" data-mnemonic="e" aria-haspopup="menu" aria-expanded="false">Edit</button>
            <button data-menu="Layer" data-mnemonic="l" aria-haspopup="menu" aria-expanded="false">Layer</button>
            <button data-menu="Select" data-mnemonic="s" aria-haspopup="menu" aria-expanded="false">Select</button>
            <button data-menu="Filter" data-mnemonic="i" aria-haspopup="menu" aria-expanded="false">Filter</button>
            <button data-menu="Tools" data-mnemonic="t" aria-haspopup="menu" aria-expanded="false">Tools</button>
            <button data-menu="View" data-mnemonic="v" aria-haspopup="menu" aria-expanded="false">View</button>
          </nav>
        </div>
      </header>
      <div class="tool-options-bar" aria-label="Tool options">
        <div class="active-tool-heading"><span id="active-tool-icon" data-icon="brush"></span><h2 id="tool-name">Brush</h2></div>
        <div id="tool-options"></div>
        <div id="transform-fields" hidden>
          <label class="field">X <input id="layer-x" type="number" step="1" /></label>
          <label class="field">Y <input id="layer-y" type="number" step="1" /></label>
          <label class="field">Scale X <span class="input-unit"><input id="layer-scale-x" type="number" step="1" /><span>%</span></span></label>
          <label class="field">Scale Y <span class="input-unit"><input id="layer-scale-y" type="number" step="1" /><span>%</span></span></label>
          <label class="field">Rotation <span class="input-unit"><input id="layer-angle" type="number" step="1" /><span>°</span></span></label>
        </div>
      </div>
      <div class="workspace">
        <aside class="tools" aria-label="Tools">
          <button class="tool active" data-action="tool.brush" data-icon="brush" aria-label="Brush (B)" title="Brush (B)"></button>
          <button class="tool" data-action="tool.rectangle" data-icon="rectangle" aria-label="Rectangle (R)" title="Rectangle (R)"></button>
          <button class="tool" data-action="tool.ellipse" data-icon="ellipse" aria-label="Ellipse (O)" title="Ellipse (O) · Hold Shift for a circle"></button>
          <button class="tool" data-action="tool.freehand-lasso" data-icon="freehand-lasso" aria-label="Freehand Lasso (L)" title="Freehand Lasso (L)"></button>
          <button class="tool" data-action="tool.polygon-lasso" data-icon="polygon-lasso" aria-label="Polygon Lasso (P)" title="Polygon Lasso (P)"></button>
          <button class="tool" data-action="tool.fill" data-icon="fill" aria-label="Fill (F)" title="Fill (F)"></button>
          <button class="tool" data-action="tool.text" data-icon="text" aria-label="Text (T)" title="Text (T)"></button>
          <button class="tool" data-action="tool.crop" data-icon="crop" aria-label="Crop (C)" title="Crop (C)"></button>
          <button class="tool" data-action="tool.transform" data-icon="transform" aria-label="Move and transform (V)" title="Move / transform (V)"></button>
          <button class="tool" data-action="tool.eyedropper" data-icon="eyedropper" aria-label="Eyedropper (I)" title="Eyedropper (I) · Hold Alt with Brush"></button>
          <div class="tool-modes">
            <button class="tool mode-tool" data-action="drawing.erase" data-icon="eraser" aria-label="Erase mode (E)" aria-pressed="false" title="Toggle draw / erase (E)"></button>
            <button class="tool mode-tool" data-action="selection.mode" data-icon="selection" aria-label="Edit selection (S)" aria-pressed="false" title="Toggle selection editing (S)"></button>
          </div>
          <div class="tool-modes generative-tools">
            <button class="tool" data-action="tool.generation" data-icon="generate" aria-label="Generate image (G)" title="Generate image (G)"></button>
            <button class="tool" id="remove-selection" data-action="selection.remove" data-icon="remove" aria-label="Remove selection" title="Remove selection"></button>
          </div>
          <div class="color-palette" role="group" aria-label="Drawing colors">
            <input id="secondary-color" class="secondary-color" type="color" value="#ffffff" aria-label="Secondary color" title="Secondary color" />
            <input id="brush-color" class="primary-color" type="color" value="#000000" aria-label="Primary color" title="Primary color" />
            <button class="color-swap" data-action="colors.swap" data-icon="swap" title="Swap colors (X)" aria-label="Swap drawing colors (X)"></button>
            <button class="color-defaults" data-action="colors.reset" data-icon="colors" title="Default black and white colors (D)" aria-label="Default black and white colors (D)"></button>
          </div>
        </aside>
        <main class="workarea">
          <div class="document-heading">
            <div class="document-name"><img src="/assets/branding/txl.svg" width="20" height="20" alt="" /><span id="document-title">Untitled</span></div>
            <div class="document-actions">
              <button id="cancel-generation" data-action="generation.cancel" hidden>Cancel generation</button>
              <button class="icon-button" data-action="history.undo" data-icon="undo" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
              <button class="icon-button" data-action="history.redo" data-icon="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
            </div>
          </div>
          <div id="stage" class="stage">
            <canvas id="canvas" aria-label="Image canvas"></canvas>
            <svg id="tool-overlay" aria-hidden="true"></svg>
            <div id="brush-cursor" hidden></div>
          </div>
        </main>
        <aside class="sidebar" aria-label="Document panels">
          <div id="document-panels">
            <section id="layers-panel">
              <div class="layer-compositing">
                <select id="layer-blend" aria-label="Layer blend mode"><option value="normal">Normal</option><option value="add">Add</option></select>
                <div id="layer-opacity-control"></div>
              </div>
              <div id="layer-tree" class="layer-tree" aria-label="Layer stack"></div>
              <div class="layer-details"><span id="layer-kind"></span><span id="layer-size"></span></div>
              <div id="selection-actions" class="selection-actions" hidden>
                <button data-action="selection.promote">Promote to mask</button>
                <button data-action="selection.deselect">Deselect</button>
              </div>
              <div class="layer-actions">
                <button class="icon-button" data-action="layer.new" data-icon="plus" title="Add pixel layer" aria-label="Add pixel layer"></button>
                <button class="icon-button" data-action="group.new" data-icon="folder" title="Add group" aria-label="Add group"></button>
                <span id="layer-count" title="Layers"></span><span class="spacer"></span>
                <button class="icon-button" id="layer-up" data-action="layer.up" data-icon="up" title="Move layer up" aria-label="Move layer up"></button>
                <button class="icon-button" id="layer-down" data-action="layer.down" data-icon="down" title="Move layer down" aria-label="Move layer down"></button>
                <button class="icon-button" data-action="layer.delete" data-icon="trash" title="Delete layer" aria-label="Delete layer"></button>
              </div>
            </section>
            <section id="history-panel" hidden>
              <div id="history-list" aria-label="Document history"></div>
              <p class="panel-hint">Select a state to return to it.</p>
            </section>
          </div>
          <section class="effects-section">
            <div class="section-heading"><h2><span data-icon="settings"></span>Filters</h2><select id="add-filter" aria-label="Add filter"></select></div>
            <div id="filter-stack"></div>
          </section>
        </aside>
      </div>
      <footer class="statusbar">
        <span id="frame-label"></span><span class="separator"></span>
        <button id="zoom-label" data-action="view.fit" title="Fit image">100%</button>
        <span id="image-operation-status" role="status"></span><span class="spacer"></span><span>RGBA · 16-bit float</span>
      </footer>
    </div>
    <dialog id="size-dialog">
      <form id="size-form">
        <h2 id="dialog-title">New document</h2>
        <p id="dialog-description"></p>
        <div class="field-pair">
          <label class="field">Width <input id="new-width" type="number" min="1" value="1000" required /></label>
          <label class="field">Height <input id="new-height" type="number" min="1" value="750" required /></label>
        </div>
        <div class="dialog-actions"><button id="cancel-size" type="button">Cancel</button><button class="primary" id="confirm-size" type="submit">Create document</button></div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
